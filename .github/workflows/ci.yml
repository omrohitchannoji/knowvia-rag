name: Offline CI & Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-offline:
    name: Run Offline Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install PyTorch (CPU)
      run: |
        python -m pip install --upgrade pip
        pip install torch --extra-index-url https://download.pytorch.org/whl/cpu

    - name: Install Project Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Safe Offline Pytest Suite
      env:
        JWT_SECRET_KEY: ci-offline-testing-key-hs256-knowvia-secret
        JWT_ALGORITHM: HS256
        QDRANT_URL: ""
        GROQ_API_KEY: ""
      run: |
        # Runs offline tests, skipping tests marked as requiring external network services
        pytest -m "not external" -v
