# ==============================================================================
# Knowvia AI — Local Production-like Docker Compose Deployment
# ==============================================================================
version: '3.8'

services:
  fastapi-backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: knowvia-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  streamlit-frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: knowvia-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://fastapi-backend:8000/api/v1
    depends_on:
      fastapi-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
